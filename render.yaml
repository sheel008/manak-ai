databases:
  - name: manak-db
    databaseName: manak_ai
    user: manak
    plan: free
    postgresMajorVersion: "16"

services:
  # ── FASTAPI + PGVECTOR SEMANTIC BACKEND ──
  - type: web
    name: manak-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: manak-db
          property: connectionString
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: ABSTAIN_THRESHOLD
        value: "40"
      - key: VECTOR_TOP_K
        value: "10"
      - key: FINAL_TOP_K
        value: "5"
      - key: CORS_ORIGINS
        value: "*"

  # ── REACT VITE FRONTEND (STATIC SITE) ──
  - type: static
    name: manak-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_TARGET
        value: https://manak-backend.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://manak-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
